<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - FBX loader with Rain and Fog</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader with Rain & Fog Effects<br />
			Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a><br>
			Controls: Arrow keys (rain speed/fog density) | RGBW/ASDF (colors) | V (wind)
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">
			import * as THREE from 'three';
			import Stats from 'three/addons/libs/stats.module.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
			import { Audio, AudioListener, AudioLoader } from 'three';

			const manager = new THREE.LoadingManager();
			let camera, scene, renderer, stats, object, loader, guiMorphsFolder;
			let mixer;
			const clock = new THREE.Clock();

			const params = {
				asset: 'Sitting Laughing'
			};

			const assets = [
				'Sitting Laughing',
				'morph_test'
			];

			// Rain and fog parameters
			const rainParams = {
				speed: 5,
				color: '#ffffff',
				windActive: false,
				windStrength: 1
			};

			const fogParams = {
				density: 0.05,
				color: '#a0a0a0',
				near: 200,
				far: 1000
			};

			let rainParticles;
			const rainCount = 5000;
			let rainGeometry, rainMaterial;

			init();

			function init() {
				const container = document.createElement('div');
				document.body.appendChild(container);

				camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
				camera.position.set(100, 200, 300);

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xa0a0a0);
				scene.fog = new THREE.Fog(fogParams.color, fogParams.near, fogParams.far);

				const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 5);
				hemiLight.position.set(0, 200, 0);
				scene.add(hemiLight);

				const dirLight = new THREE.DirectionalLight(0xFF9EF0, 5);
				dirLight.position.set(0, 200, 100);
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 200;
				dirLight.shadow.camera.bottom = -100;
				dirLight.shadow.camera.left = -120;
				dirLight.shadow.camera.right = 200;
				scene.add(dirLight);

				// ground
				const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({ color: 0xB7D0F9, depthWrite: false }));
				mesh.rotation.x = -Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add(mesh);

				const grid = new THREE.GridHelper(2000, 20, 0xffffff, 0x000000);
				grid.material.opacity = 0.2;
				grid.material.transparent = false;
				scene.add(grid);

				// Initialize rain
				initRain();
				
				loader = new FBXLoader(manager);
				loadAsset(params.asset);

				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setAnimationLoop(animate);
				renderer.shadowMap.enabled = true;
				container.appendChild(renderer.domElement);

				const controls = new OrbitControls(camera, renderer.domElement);
				controls.target.set(0, 100, 0);
				controls.update();

				window.addEventListener('resize', onWindowResize);
				window.addEventListener('keydown', onKeyDown);

				// stats
				stats = new Stats();
				container.appendChild(stats.dom);

				const gui = new GUI();
				gui.add(params, 'asset', assets).onChange(function (value) {
					loadAsset(value);
				});

				guiMorphsFolder = gui.addFolder('Morphs').hide();

				// Add rain and fog controls to GUI
				const rainFolder = gui.addFolder('Rain Controls');
				rainFolder.add(rainParams, 'speed', 1, 20).name('Speed');
				rainFolder.add(rainParams, 'windActive').name('Wind Active');
				rainFolder.add(rainParams, 'windStrength', 0, 5).name('Wind Strength');
				rainFolder.addColor(rainParams, 'color').name('Color').onChange(updateRainColor);
				
				const fogFolder = gui.addFolder('Fog Controls');
				fogFolder.add(fogParams, 'density', 0, 0.1).name('Density').onChange(updateFog);
				fogFolder.add(fogParams, 'near', 0, 1000).name('Near').onChange(updateFog);
				fogFolder.add(fogParams, 'far', 100, 2000).name('Far').onChange(updateFog);
				fogFolder.addColor(fogParams, 'color').name('Color').onChange(updateFog);

				const rgbeLoader = new RGBELoader();
				rgbeLoader.load('models/rgbe/construction_yard_2k.hdr', function (texture) {
					texture.mapping = THREE.EquirectangularReflectionMapping;
					scene.background = texture;
					scene.environment = texture;
				});

				const listener = new AudioListener();
				camera.add(listener);

				const sound = new Audio(listener);
				const audioLoader = new AudioLoader();
				audioLoader.load('models/rgbe/01 GRRRLS.flac', function (buffer) {
					console.log("Audio cargado exitosamente");
					sound.setBuffer(buffer);
					sound.setLoop(true);
					sound.setVolume(0.5);
					sound.play();
				});
			}

			function initRain() {
				// Create rain particles
				rainGeometry = new THREE.BufferGeometry();
				const positions = new Float32Array(rainCount * 3);
				const sizes = new Float32Array(rainCount);

				for (let i = 0; i < rainCount; i++) {
					positions[i * 3] = Math.random() * 2000 - 1000;
					positions[i * 3 + 1] = Math.random() * 500 + 200;
					positions[i * 3 + 2] = Math.random() * 2000 - 1000;
					sizes[i] = 1 + Math.random() * 2;
				}

				rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
				rainGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

				rainMaterial = new THREE.PointsMaterial({
					color: new THREE.Color(rainParams.color),
					size: 2,
					transparent: true,
					opacity: 0.9,
					sizeAttenuation: true,
					alphaTest: 0.1
				});

				rainParticles = new THREE.Points(rainGeometry, rainMaterial);
				scene.add(rainParticles);
			}

			function updateRain() {
				const positions = rainGeometry.attributes.position.array;
				const windEffect = rainParams.windActive ? rainParams.windStrength : 0;

				for (let i = 0; i < rainCount; i++) {
					positions[i * 3 + 1] -= rainParams.speed;
					positions[i * 3 + 0] += windEffect;

					// Reset particles that fall below ground level
					if (positions[i * 3 + 1] < 0) {
						positions[i * 3 + 1] = Math.random() * 200 + 300;
						positions[i * 3 + 0] = Math.random() * 2000 - 1000;
						positions[i * 3 + 2] = Math.random() * 2000 - 1000;
					}
				}

				rainGeometry.attributes.position.needsUpdate = true;
			}

			function updateRainColor() {
				rainMaterial.color.set(rainParams.color);
			}

			function updateFog() {
				scene.fog = new THREE.Fog(fogParams.color, fogParams.near, fogParams.far);
				scene.fog.density = fogParams.density;
				scene.background = new THREE.Color(fogParams.color);
			}

			function onKeyDown(event) {
				// Prevent default behavior for arrow keys
				if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
					event.preventDefault();
				}

				switch (event.key) {  // Changed to event.key (not lowercase) for arrow keys
					// Rain speed control
					case 'ArrowUp':
						rainParams.speed = Math.min(rainParams.speed + 1, 20);
						break;
					case 'ArrowDown':
						rainParams.speed = Math.max(rainParams.speed - 1, 1);
						break;
						
					// Fog density control - FIXED THIS SECTION
					case 'ArrowRight':
						fogParams.far += 10;
						fogParams.near += 20; 
						fogParams.density = Math.min(fogParams.density + 0.05, 0.1);
						updateFog();
						break;
					case 'ArrowLeft':
						fogParams.far -= 10;
						fogParams.near -= 20; 
						fogParams.density = Math.max(fogParams.density - 0.05, 0);
						updateFog();
						break;
						
					// Rain color control
					case 'r':
						rainParams.color = '#f5b5e2';
						updateRainColor();
						break;
					case 'g':
						rainParams.color = '#c3fae7';
						updateRainColor();
						break;
					case 'b':
						rainParams.color = '#aaf5fa';
						updateRainColor();
						break;
					case 'w':
						rainParams.color = '#ffffff';
						updateRainColor();
						break;
						
					// Fog color control
					case 'a':
						fogParams.color = '#f5b5e2';
						updateFog();
						break;
					case 's':
						fogParams.color = '#c3fae7';
						updateFog();
						break;
					case 'd':
						fogParams.color = '#aaf5fa';
						updateFog();
						break;
					case 'f':
						fogParams.color = '#ffffff';
						updateFog();
						break;
						
					// Wind toggle
					case 'v':
						rainParams.windActive = !rainParams.windActive;
						break;
				}
			}

			function loadAsset(asset) {
				loader.load('models/fbx/' + asset + '.fbx', function (group) {
					if (object) {
						object.traverse(function (child) {
							if (child.material) {
								const materials = Array.isArray(child.material) ? child.material : [child.material];
								materials.forEach(material => {
									if (material.map) material.map.dispose();
									material.dispose();
								});
							}

							if (child.geometry) child.geometry.dispose();
						});

						scene.remove(object);
					}

					object = group;

					if (object.animations && object.animations.length) {
						mixer = new THREE.AnimationMixer(object);
						const action = mixer.clipAction(object.animations[0]);
						action.play();
					} else {
						mixer = null;
					}

					guiMorphsFolder.children.forEach((child) => child.destroy());
					guiMorphsFolder.hide();

					object.traverse(function (child) {
						if (child.isMesh) {
							child.material = new THREE.MeshStandardMaterial({
								color: 0xFF9EF0,
								transparent: true,
								opacity: 0.7,
								roughness: 5,
								metalness: 0.7
							});

							child.castShadow = true;
							child.receiveShadow = true;

							if (child.morphTargetDictionary) {
								guiMorphsFolder.show();
								const meshFolder = guiMorphsFolder.addFolder(child.name || child.uuid);
								Object.keys(child.morphTargetDictionary).forEach((key) => {
									meshFolder.add(child.morphTargetInfluences, child.morphTargetDictionary[key], 0, 1, 0.01);
								});
							}
						}
					});

					scene.add(object);
				});
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function animate() {
				const delta = clock.getDelta();

				if (mixer) mixer.update(delta);
				
				// Update rain particles
				updateRain();

				renderer.render(scene, camera);
				stats.update();
			}
		</script>
	</body>
</html>
